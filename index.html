<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Insina Health" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07090f" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Insina Health</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Companion mode: swap to the companion manifest so "Add to Home Screen"
         launches /?companion=1 instead of the full web app. iOS reads the linked
         manifest's start_url at add-to-home-screen time. -->
    <script>
      (function () {
        if (location.search.indexOf('companion') === -1) return;
        var link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', '/manifest-companion.json');
        var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (title) title.setAttribute('content', 'Insina');
        document.title = 'Insina Companion';
      })();
    </script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch(function (err) { console.warn('SW registration failed:', err); });
        });
      }
    </script>
  </head>
  <body style="background:#07090f; margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
